# Jasmin C2 — 中心节点 (MySQL + Redis)
# 部署在一台服务器上，其他工作节点用 docker-compose.worker.yml 连接此处
#
# 用法: docker compose -f docker-compose.master.yml up -d

services:
  # ── MySQL 主库 ──
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jasmin_root_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jasmin_db}
      MYSQL_USER: ${MYSQL_USER:-jasminadmin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jasmin_secure_pw}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../Web Panel/database/jasmin_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "${DB_LISTEN:-0.0.0.0:3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --bind-address=0.0.0.0

  # ── Redis Session ──
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --bind 0.0.0.0
      --protected-mode no
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_LISTEN:-0.0.0.0:6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  mysql_data:
  redis_data:
