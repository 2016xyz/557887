worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ── 上游服务 ──
    upstream php_backend {
        least_conn;
        server php:80;
        # docker compose scale php=N 自动注册
    }

    upstream python_backend {
        least_conn;
        server python:5000;
    }

    # ── 日志 ──
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── PHP 后台 (端口 8080) ──
    server {
        listen 80;      # 80 端口: 让 http://host/... 这类"不带端口"的 URL 也能用
        listen 8080;
        server_name _;

        client_max_body_size 100m;

        # 静态文件缓存
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            proxy_pass http://php_backend;
            # ★ 这几个头必须与 location / 保持一致。
            # 本 location 是按 URI 正则匹配的（不检查文件是否真的存在），
            # 所以 `POST /checklogin.php/x.css` 也会命中这里。若不覆盖
            # X-Real-IP，客户端自带的同名头会被原样透传给 PHP ——
            # 而 checklogin.php 正是用 X-Real-IP 做限速键，
            # 于是每个请求换一个伪造 IP 就能无限爆破。
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_valid 200 1h;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # 健康检查端点
        location /health {
            access_log off;
            proxy_pass http://php_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://php_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }

    # ── Python 后台 (端口 5000) ──
    server {
        listen 5000;
        server_name _;

        client_max_body_size 100m;

        location /health {
            access_log off;
            proxy_pass http://python_backend;
        }

        location / {
            proxy_pass http://python_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
