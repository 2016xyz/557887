worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # ── 上游服务 ──
    # 用 Docker 内嵌 DNS 动态解析副本 IP：compose scale/重建后副本 IP 会变，
    # 静态 upstream 只在启动时解析一次 —— 变了就持续 502 直到手动 reload nginx。
    # （本镜像 nginx 1.31.6，`server ... resolve` 需 >= 1.27.3）
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 注：`resolve` 必须配合 `zone`（upstream 需放入共享内存），否则 nginx 直接
    # 以 emerg 起不来 —— "resolving names at run time requires upstream ... to be
    # in shared memory"。zone 大小按副本数给足即可（64k 够几十个 server 条目）。
    upstream php_backend {
        zone php_backend 64k;
        least_conn;
        server php:80 resolve;
        # docker compose scale php=N 自动注册
    }

    upstream python_backend {
        zone python_backend 64k;
        least_conn;
        server python:5000 resolve;
    }

    # ── 日志 ──
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ── PHP 后台 (端口 8080) ──
    server {
        listen 80;      # 80 端口: 让 http://host/... 这类"不带端口"的 URL 也能用
        listen 8080;
        server_name _;

        client_max_body_size 100m;

        # ── 静态资源 ──
        # 只对 /assets/ 前缀（真实静态目录）下发缓存头。
        # ★ 此前用 `location ~* \.(css|js|...)$` 按 URI 后缀正则匹配（不判断文件
        #   是否真的存在），`/download_file.php/x.css` 这类动态/已鉴权请求也会命中，
        #   被加上 `Cache-Control: public, immutable` 缓存 1 小时 —— 私钥下载可被
        #   中间缓存共享（缓存欺骗/泄露）。另外 `proxy_cache_valid` 在没有
        #   `proxy_cache_path`/`proxy_cache` 时完全无效，属于误导性死配置。
        # 改为前缀匹配真实静态目录；其余请求（含 *.php/x.css 这类）一律走
        # location / —— 它已完整覆盖 Host / X-Real-IP 等头。
        location ^~ /assets/ {
            proxy_pass http://php_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1h;
            add_header Cache-Control "public";
        }

        # 健康检查端点
        location = /health {
            access_log off;
            proxy_pass http://php_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / {
            proxy_pass http://php_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }

    # ── Python 后台 (端口 5000) ──
    server {
        listen 5000;
        server_name _;

        client_max_body_size 100m;

        location = /health {
            access_log off;
            proxy_pass http://python_backend;
        }

        location / {
            proxy_pass http://python_backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }
    }
}
