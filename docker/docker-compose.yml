services:
  # ── MySQL ──
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jasmin_root_pw}
      MYSQL_DATABASE: jasmin_db
      MYSQL_USER: jasminadmin
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jasmin_secure_pw}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../Web Panel/database/jasmin_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # 默认只绑本机：此前 "3306:3306" 会监听 0.0.0.0，公网可直连拖库。
      # 需要远程访问时用 DB_LISTEN 显式放开（并自行加防火墙）。
      - "${DB_LISTEN:-127.0.0.1:3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4

  # ── PHP Version ──
  php:
    build:
      context: ..
      dockerfile: docker/Dockerfile.php
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 与 python 共用同一 payloads 卷：两端的 .pw_changed 标记、RSA 密钥、载荷
      # 必须互相可见，否则一端改的口令另一端看不到（重启即被重置回 ADMIN_PASSWORD）。
      - shared_payloads:/var/www/html/payloads
      - shared_passwords:/var/www/html/passwords
    environment:
      GIT_TOKEN: ${GIT_TOKEN:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: jasmin_db
      DB_USER: jasminadmin
      DB_PASS: ${MYSQL_PASSWORD:-jasmin_secure_pw}
      HANDSHAKE_SECRET: ${HANDSHAKE_SECRET:-jasmin@123}
    ports:
      - "8080:80"

  # ── Python Version ──
  python:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - shared_payloads:/app/payloads
    environment:
      GIT_TOKEN: ${GIT_TOKEN:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: jasmin_db
      DB_USER: jasminadmin
      DB_PASS: ${MYSQL_PASSWORD:-jasmin_secure_pw}
      HANDSHAKE_SECRET: ${HANDSHAKE_SECRET:-jasmin@123}
      # 多副本时若不提供同一 SECRET_KEY，各副本会各自随机生成 -> 会话签名互不兼容。
      # entrypoint 在未设置时从共享环境变量确定性派生，故此处留空亦可。
      SECRET_KEY: ${SECRET_KEY:-}
    ports:
      - "5000:5000"

volumes:
  mysql_data:
  shared_payloads:   # php 与 python 共用（密钥 + 载荷 + .pw_changed 标记）
  shared_passwords:
