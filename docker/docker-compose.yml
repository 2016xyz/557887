services:
  # ── MySQL ──
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: jasmin_root_pw
      MYSQL_DATABASE: jasmin_db
      MYSQL_USER: jasminadmin
      MYSQL_PASSWORD: jasmin_secure_pw
    volumes:
      - mysql_data:/var/lib/mysql
      - ../Web Panel/database/jasmin_db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4

  # ── PHP Version ──
  php:
    build:
      context: ..
      dockerfile: docker/Dockerfile.php
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - php_payloads:/var/www/html/payloads
      - php_passwords:/var/www/html/passwords
    environment:
      GIT_TOKEN: ${GIT_TOKEN:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: jasmin_db
      DB_USER: jasminadmin
      DB_PASS: jasmin_secure_pw
      HANDSHAKE_SECRET: jasmin@123
    ports:
      - "8080:80"

  # ── Python Version ──
  python:
    build:
      context: ..
      dockerfile: docker/Dockerfile.python
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - py_payloads:/app/payloads
    environment:
      GIT_TOKEN: ${GIT_TOKEN:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: jasmin_db
      DB_USER: jasminadmin
      DB_PASS: jasmin_secure_pw
      HANDSHAKE_SECRET: jasmin@123
    ports:
      - "5000:5000"

volumes:
  mysql_data:
  php_payloads:
  php_passwords:
  py_payloads:
